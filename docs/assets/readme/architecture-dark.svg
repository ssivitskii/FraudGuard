<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">FraudGuard architecture</title>
<desc id="desc">CHRONOLOGICAL BENCHMARK: Validate &amp; split → Fit on train → Select on valid → Freeze &amp; test. SEPARATE GENERIC-TRANSACTION APPLICATION: Generic CSV → Train pipeline → Saved artifact → Streamlit. The ULB benchmark does not overwrite the app model. Its scores are not calibrated probabilities.</desc>
<rect x="1" y="1" width="1198" height="478" rx="22" fill="#241A12" stroke="#58412B"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<defs><marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L6 4L0 7" fill="none" stroke="#FFAF6A" stroke-width="1.4"/></marker></defs>
<text x="32" y="44" font-size="15" fill="#FFAF6A" font-weight="700" letter-spacing="1.6">CHRONOLOGICAL BENCHMARK</text>
<rect x="32" y="68" width="260" height="123" rx="12" fill="#39291A" stroke="#58412B"/>
<text x="50" y="92" font-size="13" fill="#FFAF6A" font-weight="700" >01</text>
<text x="50" y="123" font-size="23" fill="#FFF1E1" font-weight="650" >Validate &amp; split</text>
<text x="50" y="151" font-size="17" fill="#D1B699" font-weight="400" >ULB transaction CSV</text>
<text x="50" y="174" font-size="17" fill="#D1B699" font-weight="400" >60 / 20 / 20 time groups</text>
<path d="M296 130H312" fill="none" stroke="#FFAF6A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="320" y="68" width="260" height="123" rx="12" fill="#39291A" stroke="#58412B"/>
<text x="338" y="92" font-size="13" fill="#FFAF6A" font-weight="700" >02</text>
<text x="338" y="123" font-size="23" fill="#FFF1E1" font-weight="650" >Fit on train</text>
<text x="338" y="151" font-size="17" fill="#D1B699" font-weight="400" >Scaling + classifiers</text>
<text x="338" y="174" font-size="17" fill="#D1B699" font-weight="400" >Logistic / Random Forest</text>
<path d="M584 130H600" fill="none" stroke="#FFAF6A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="608" y="68" width="260" height="123" rx="12" fill="#39291A" stroke="#58412B"/>
<text x="626" y="92" font-size="13" fill="#FFAF6A" font-weight="700" >03</text>
<text x="626" y="123" font-size="23" fill="#FFF1E1" font-weight="650" >Select on valid</text>
<text x="626" y="151" font-size="17" fill="#D1B699" font-weight="400" >Model: average precision</text>
<text x="626" y="174" font-size="17" fill="#D1B699" font-weight="400" >Threshold: F1</text>
<path d="M872 130H888" fill="none" stroke="#FFAF6A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="896" y="68" width="260" height="123" rx="12" fill="#39291A" stroke="#58412B"/>
<text x="914" y="92" font-size="13" fill="#FFAF6A" font-weight="700" >04</text>
<text x="914" y="123" font-size="23" fill="#FFF1E1" font-weight="650" >Freeze &amp; test</text>
<text x="914" y="151" font-size="17" fill="#D1B699" font-weight="400" >No model refit</text>
<text x="914" y="174" font-size="17" fill="#D1B699" font-weight="400" >AP + budget metrics</text>
<text x="32" y="237" font-size="15" fill="#FFAF6A" font-weight="700" letter-spacing="1.6">SEPARATE GENERIC-TRANSACTION APPLICATION</text>
<rect x="32" y="261" width="260" height="123" rx="12" fill="#39291A" stroke="#58412B"/>
<text x="50" y="285" font-size="13" fill="#FFAF6A" font-weight="700" >01</text>
<text x="50" y="316" font-size="23" fill="#FFF1E1" font-weight="650" >Generic CSV</text>
<text x="50" y="344" font-size="17" fill="#D1B699" font-weight="400" >Amount, type, device</text>
<text x="50" y="367" font-size="17" fill="#D1B699" font-weight="400" >Time + isFraud</text>
<path d="M296 323H312" fill="none" stroke="#FFAF6A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="320" y="261" width="260" height="123" rx="12" fill="#39291A" stroke="#58412B"/>
<text x="338" y="285" font-size="13" fill="#FFAF6A" font-weight="700" >02</text>
<text x="338" y="316" font-size="23" fill="#FFF1E1" font-weight="650" >Train pipeline</text>
<text x="338" y="344" font-size="17" fill="#D1B699" font-weight="400" >Original stratified split</text>
<text x="338" y="367" font-size="17" fill="#D1B699" font-weight="400" >scripts/train.py</text>
<path d="M584 323H600" fill="none" stroke="#FFAF6A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="608" y="261" width="260" height="123" rx="12" fill="#39291A" stroke="#58412B"/>
<text x="626" y="285" font-size="13" fill="#FFAF6A" font-weight="700" >03</text>
<text x="626" y="316" font-size="23" fill="#FFF1E1" font-weight="650" >Saved artifact</text>
<text x="626" y="344" font-size="17" fill="#D1B699" font-weight="400" >App-compatible features</text>
<text x="626" y="367" font-size="17" fill="#D1B699" font-weight="400" >Trained preprocessing</text>
<path d="M872 323H888" fill="none" stroke="#FFAF6A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="896" y="261" width="260" height="123" rx="12" fill="#39291A" stroke="#58412B"/>
<text x="914" y="285" font-size="13" fill="#FFAF6A" font-weight="700" >04</text>
<text x="914" y="316" font-size="23" fill="#FFF1E1" font-weight="650" >Streamlit</text>
<text x="914" y="344" font-size="17" fill="#D1B699" font-weight="400" >Transaction form</text>
<text x="914" y="367" font-size="17" fill="#D1B699" font-weight="400" >Fixed threshold: 0.5</text>
<path d="M32 419H1168" stroke="#58412B"/>
<text x="32" y="451" font-size="17" fill="#D1B699" font-weight="400" >The ULB benchmark does not overwrite the app model. Its scores are not calibrated probabilities.</text>
</g></svg>
